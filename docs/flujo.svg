<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">OMNI Retail · del video a la decisión</title><desc id="d">Cada etapa dice qué aporta y con qué modelo. Las cifras de velocidad están medidas en esta máquina; las de acierto vienen de la validación con la que se entrenó cada modelo.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="52" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">OMNI Retail · del video a la decisión</text><text x="48" y="82" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Cada etapa dice qué aporta y con qué modelo. Las cifras de velocidad están medidas en esta máquina; las de acierto</text><text x="48" y="102" font-size="14" font-weight="400" fill="#475569" text-anchor="start">vienen de la validación con la que se entrenó cada modelo.</text><rect x="60" y="150" width="360" height="900" rx="18" fill="#e2e8f0" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="76" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">ENTRADA</text><text x="76" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Lo que ya existe en la tienda</text><rect x="460" y="150" width="360" height="900" rx="18" fill="#dbeafe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="476" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">DETECCIÓN</text><text x="476" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué hay en cada fotograma</text><rect x="860" y="150" width="340" height="900" rx="18" fill="#ede9fe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="876" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">IDENTIDAD</text><text x="876" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Quién es quién entre fotogramas</text><rect x="1240" y="150" width="340" height="900" rx="18" fill="#dcfce7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1256" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">ANALÍTICA</text><text x="1256" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué significa para el negocio</text><rect x="1620" y="150" width="320" height="900" rx="18" fill="#fef3c7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1636" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">DECISIÓN</text><text x="1636" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué se hace con eso</text><path d="M 400 330 H 440.0 V 330 H 480" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="440.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">fotogramas</text><path d="M 400 700 V 1010 H 1390 V 960" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="830.0" y="1002" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">las zonas entran en la analítica, no en el detector</text><path d="M 800 330 H 840.0 V 400 H 880" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="840.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">cajas</text><path d="M 800 660 H 1030.0 V 880 H 1260" fill="none" stroke="#334155" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="1030.0" y="650" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">densidad</text><path d="M 1180 400 H 1220.0 V 400 H 1260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1220.0" y="390" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">ID estable</text><path d="M 1560 400 H 1600.0 V 330 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 700 H 1600.0 V 560 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 880 H 1600.0 V 790 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="80" y="250" width="320" height="160" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="262" width="69.6" height="20" rx="10" fill="#e2e8f0"/><text x="130.8" y="276" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">EXISTENTE</text><text x="96" y="304" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cámara que ya está puesta</text><text x="96" y="329" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Un .mp4 de la cámara de siempre.</text><text x="96" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Sin sensores nuevos, sin obra,</text><text x="96" y="361" font-size="11" font-weight="400" fill="#475569" text-anchor="start">sin tocar el punto de venta.</text><rect x="80" y="560" width="320" height="170" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="572" width="56.800000000000004" height="20" rx="10" fill="#dbeafe"/><text x="124.4" y="586" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">UNA VEZ</text><text x="96" y="614" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Zonas dibujadas a mano</text><text x="96" y="639" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Una línea sobre la puerta y un</text><text x="96" y="655" font-size="11" font-weight="400" fill="#475569" text-anchor="start">polígono por área. Se guardan</text><text x="96" y="671" font-size="11" font-weight="400" fill="#475569" text-anchor="start">de 0 a 1: valen aunque cambie</text><text x="96" y="687" font-size="11" font-weight="400" fill="#475569" text-anchor="start">la resolución del fotograma.</text><rect x="480" y="240" width="320" height="245" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="252" width="63.2" height="20" rx="10" fill="#dcfce7"/><text x="527.6" y="266" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">DETECTOR</text><text x="496" y="294" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">YOLO11n · personas</text><text x="496" y="319" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Dice dónde hay una persona en</text><text x="496" y="335" font-size="11" font-weight="400" fill="#475569" text-anchor="start">cada fotograma, por separado.</text><text x="496" y="351" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Entrenado sobre COCO.</text><line x1="496" y1="359" x2="784" y2="359" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="375" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50 (COCO)</text><text x="784" y="375" font-size="12" font-weight="700" fill="#166534" text-anchor="end">55.1 %</text><text x="496" y="394" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50-95</text><text x="784" y="394" font-size="12" font-weight="700" fill="#166534" text-anchor="end">39.4 %</text><text x="496" y="413" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">velocidad medida</text><text x="784" y="413" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">44.3 fps</text><text x="496" y="432" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">latencia</text><text x="784" y="432" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">22.6 ms</text><rect x="480" y="570" width="320" height="225" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="582" width="63.2" height="20" rx="10" fill="#fef3c7"/><text x="527.6" y="596" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">OPCIONAL</text><text x="496" y="624" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">YOLO-World · anaquel</text><text x="496" y="649" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Vocabulario abierto: se le pide</text><text x="496" y="665" font-size="11" font-weight="400" fill="#475569" text-anchor="start">«bottle, box, can» sin reentrenar.</text><text x="496" y="681" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Umbral bajo a propósito — importa</text><text x="496" y="697" font-size="11" font-weight="400" fill="#475569" text-anchor="start">cuánto hay, no qué producto es.</text><line x1="496" y1="705" x2="784" y2="705" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="721" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">clases pedidas</text><text x="784" y="721" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">9 términos</text><text x="496" y="740" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">velocidad medida</text><text x="784" y="740" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">27.7 fps</text><text x="496" y="759" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">umbral</text><text x="784" y="759" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">0.05</text><rect x="880" y="300" width="300" height="250" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="896" y="312" width="82.4" height="20" rx="10" fill="#ede9fe"/><text x="937.2" y="326" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">SEGUIMIENTO</text><text x="896" y="354" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">ByteTrack</text><text x="896" y="379" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Le pone el mismo ID a la misma</text><text x="896" y="395" font-size="11" font-weight="400" fill="#475569" text-anchor="start">persona entre fotogramas.</text><text x="896" y="411" font-size="11" font-weight="400" fill="#475569" text-anchor="start"></text><text x="896" y="427" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Sin esto, alguien visto en 200</text><text x="896" y="443" font-size="11" font-weight="400" fill="#475569" text-anchor="start">fotogramas serían 200 personas</text><text x="896" y="459" font-size="11" font-weight="400" fill="#475569" text-anchor="start">y el número no valdría nada.</text><line x1="896" y1="467" x2="1164" y2="467" stroke="#e2e8f0" stroke-width="1.5"/><text x="896" y="483" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">no necesita todos los</text><text x="1164" y="483" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="end">fotogramas</text><text x="896" y="502" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">margen que deja</text><text x="1164" y="502" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="end">CPU para el resto</text><rect x="1260" y="300" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="326" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cruces con dirección</text><text x="1276" y="351" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Entró o salió según por dónde</text><text x="1276" y="367" font-size="11" font-weight="400" fill="#475569" text-anchor="start">atravesó la línea.</text><line x1="1276" y1="375" x2="1544" y2="375" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="391" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">aforo ahora</text><text x="1544" y="391" font-size="12" font-weight="700" fill="#166534" text-anchor="end">entradas − salidas</text><rect x="1260" y="610" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="636" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Permanencia por zona</text><text x="1276" y="661" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Segundos acumulados por persona</text><text x="1276" y="677" font-size="11" font-weight="400" fill="#475569" text-anchor="start">dentro de cada polígono.</text><line x1="1276" y1="685" x2="1544" y2="685" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="701" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">tiempo</text><text x="1544" y="701" font-size="12" font-weight="700" fill="#166534" text-anchor="end">del video, no del reloj</text><rect x="1260" y="790" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="816" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Nivel de anaquel</text><text x="1276" y="841" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Densidad de bordes contra la del</text><text x="1276" y="857" font-size="11" font-weight="400" fill="#475569" text-anchor="start">primer fotograma.</text><line x1="1276" y1="865" x2="1544" y2="865" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="881" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">es</text><text x="1544" y="881" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">heurística, no detector</text><rect x="1640" y="250" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="262" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="276" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="304" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cuánta gente entró y no compró</text><text x="1656" y="329" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Se cruza con la venta del día.</text><text x="1656" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Es la conversión real de la</text><text x="1656" y="361" font-size="11" font-weight="400" fill="#475569" text-anchor="start">tienda.</text><rect x="1640" y="480" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="492" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="506" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="534" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cuánto se espera en caja</text><text x="1656" y="559" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Cuándo abrir otra. El dato que</text><text x="1656" y="575" font-size="11" font-weight="400" fill="#475569" text-anchor="start">hoy se estima a ojo.</text><rect x="1640" y="710" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="722" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="736" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="764" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Qué estante reponer</text><text x="1656" y="789" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Y antes de que un cliente se</text><text x="1656" y="805" font-size="11" font-weight="400" fill="#475569" text-anchor="start">vaya sin el producto.</text><rect x="48" y="1090" width="1904" height="52" rx="12" fill="#e2e8f0"/><text x="70" y="1122" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Sin el seguimiento, una persona vista en 200 fotogramas serían 200 personas. Ese es el paso que convierte detecciones en una cifra de negocio.</text></svg>